<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Тревел лента</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="feed.css?v=11" />
</head>
<body>
  <main class="phone">
    <div class="frame">
      <div id="bench" aria-hidden="true"></div>
      <div class="feed" id="feed" tabindex="0"></div>
      <header class="topbar">
        <button type="button" class="icon" data-action="close" aria-label="Закрыть">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <p class="brand">Тревел лента</p>
        <span class="icon" aria-hidden="true"></span>
      </header>
      <div class="scrub">
        <div class="scrub-bar"><div class="scrub-fill" id="scrub"></div></div>
        <span id="time">00:00</span>
      </div>
      <p class="status" id="status" hidden></p>
    </div>
  </main>
  <script>
    window.onKinescopeIframeAPIReady = window.onKinescopeIframeApiReady = function (factory) {
      window.__kinescopeFactory = factory;
      window.dispatchEvent(new Event("kinescope-ready"));
    };
  </script>
  <script src="https://player.kinescope.io/latest/iframe.player.js"></script>
  <script src="feed.js?v=11"></script>
</body>
</html>
